<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아아 장인 시안</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #222; font-family: "Malgun Gothic", sans-serif; }
  canvas { display: block; }
  #ui { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; align-items: center; }
  #ui button {
    font: bold 15px "Malgun Gothic", sans-serif; padding: 8px 14px; border: 3px solid #111; border-radius: 10px;
    background: #fff; box-shadow: 0 4px 0 #111; cursor: pointer;
  }
  #ui button.on { background: #ffd84d; }
  #desc { color: #fff; font-size: 14px; text-shadow: 0 2px 0 #000; margin-left: 8px; }
  #done {
    position: fixed; right: 20px; bottom: 20px; font: bold 22px "Malgun Gothic", sans-serif; padding: 12px 26px;
    border: 4px solid #111; border-radius: 14px; background: #7ee08f; box-shadow: 0 6px 0 #111;
  }
  #timer { position: fixed; top: 12px; right: 20px; font: bold 30px monospace; color: #fff; text-shadow: 0 3px 0 #000; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="ui">
  <button data-t="A">A 파스텔</button>
  <button data-t="B">B 우드 카페</button>
  <button data-t="C">C 모노 레드</button>
  <span id="desc"></span>
</div>
<div id="timer">00.00</div>
<button id="done">완성!</button>
<script type="module">
import * as THREE from 'three';

const THEMES = {
  A: { desc: '파스텔 + 검은 외곽선 (플래시 만화 느낌)', outline: true, bg: '#ffe9ef',
    wall: '#ffd3dc', floor: '#f3e2c0', tile: '#e9d2a8', cab: '#8fd3c0', top: '#fffaf0', machine: '#ff8fa3',
    machine2: '#ffffff', metal: '#cfd8dc', accent: '#6cc4e8', grinder: '#ffcf5a', skin: '#ffd2b0', sleeve: '#ffffff', light: '#fff4e8' },
  B: { desc: '따뜻한 나무 + 스테인리스, 외곽선 없음 (아늑한 카페)', outline: false, bg: '#3b2a20',
    wall: '#e8d8bd', floor: '#7a4f33', tile: '#6b432b', cab: '#6a4630', top: '#d6b47f', machine: '#d4d2cc',
    machine2: '#3a3a3a', metal: '#b8bcc0', accent: '#2f6b4f', grinder: '#2b2b2b', skin: '#f2c49b', sleeve: '#2f6b4f', light: '#ffd9a0' },
  C: { desc: '흰 주방 + 빨간 머신 포인트, 외곽선 (깔끔·강한 대비)', outline: true, bg: '#d9dde0',
    wall: '#f4f4f2', floor: '#4a4a50', tile: '#3c3c42', cab: '#2e2e34', top: '#ececec', machine: '#e23d3d',
    machine2: '#222222', metal: '#c9cdd1', accent: '#ffcc33', grinder: '#e23d3d', skin: '#f5c9a6', sleeve: '#ffffff', light: '#ffffff' },
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.toneMapping = THREE.NoToneMapping;
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 50);
camera.position.set(0.4, 1.72, 1.45);
camera.lookAt(0.5, 0.92, -0.4);

let scene, hand, T;
const mat = c => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.75 });
const lineMat = new THREE.LineBasicMaterial({ color: '#111' });

function add(parent, geo, color, x, y, z, opt = {}) {
  const m = new THREE.Mesh(geo, mat(color));
  m.position.set(x, y, z);
  if (opt.rx) m.rotation.x = opt.rx;
  if (opt.rz) m.rotation.z = opt.rz;
  m.castShadow = m.receiveShadow = true;
  if (T.outline && !opt.noLine) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), lineMat));
  parent.add(m);
  return m;
}
const box = (p, w, h, d, c, x, y, z, o) => add(p, new THREE.BoxGeometry(w, h, d), c, x, y + h / 2, z, o);
const cyl = (p, r1, r2, h, c, x, y, z, seg = 8, o) => add(p, new THREE.CylinderGeometry(r1, r2, h, seg), c, x, y + h / 2, z, o);

const TOP = 0.9; // 카운터 높이

function build(key) {
  T = THEMES[key];
  document.getElementById('desc').textContent = T.desc;
  document.querySelectorAll('#ui button').forEach(b => b.classList.toggle('on', b.dataset.t === key));
  scene = new THREE.Scene();
  scene.background = new THREE.Color(T.bg);

  scene.add(new THREE.HemisphereLight('#ffffff', T.bg, 1.8));
  const sun = new THREE.DirectionalLight(T.light, 2.2);
  sun.position.set(-1.5, 3, 2); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 });
  scene.add(sun);

  // 방
  box(scene, 6, 0.02, 4, T.floor, 0.6, -0.02, 0, { noLine: true });
  for (let i = -5; i < 7; i++) for (let j = -3; j < 3; j++)
    if ((i + j) % 2 === 0) box(scene, 0.5, 0.005, 0.5, T.tile, 0.6 + i * 0.5, 0, j * 0.5 + 0.25, { noLine: true });
  box(scene, 6, 3, 0.1, T.wall, 0.6, 0, -0.75, { noLine: true });
  box(scene, 0.1, 3, 4, T.wall, 2.6, 0, 0, { noLine: true });
  box(scene, 6, 0.06, 0.04, T.accent, 0.6, 1.25, -0.69);
  // 선반 + 원두 병
  box(scene, 1.4, 0.04, 0.22, T.cab, -0.3, 1.75, -0.6);
  for (let i = 0; i < 4; i++) cyl(scene, 0.06, 0.06, 0.18, i % 2 ? T.accent : T.grinder, -0.85 + i * 0.35, 1.79, -0.6);

  // 카운터 (왼쪽 → 오른쪽 + 오른쪽 끝 싱크대)
  box(scene, 3.2, TOP - 0.05, 0.75, T.cab, 0.4, 0, -0.32);
  box(scene, 3.26, 0.05, 0.8, T.top, 0.4, TOP - 0.05, -0.32);

  // 분쇄기 (가장 왼쪽)
  const gx = -0.55;
  box(scene, 0.24, 0.32, 0.28, T.grinder, gx, TOP, -0.45);
  box(scene, 0.18, 0.05, 0.12, T.machine2, gx, TOP + 0.08, -0.25);
  cyl(scene, 0.09, 0.05, 0.22, '#ffffff', gx, TOP + 0.32, -0.45, 8);
  cyl(scene, 0.06, 0.09, 0.08, '#6b3d22', gx, TOP + 0.4, -0.45, 8, { noLine: true });
  // 넉박스 (분쇄기 앞)
  cyl(scene, 0.07, 0.07, 0.1, T.machine2, gx - 0.02, TOP, -0.05, 8);

  // 에스프레소 머신 (정면)
  const mx = 0.0;
  box(scene, 0.62, 0.42, 0.45, T.machine, mx, TOP, -0.42);
  box(scene, 0.64, 0.05, 0.47, T.machine2, mx, TOP + 0.42, -0.42);
  box(scene, 0.5, 0.08, 0.02, T.machine2, mx, TOP + 0.3, -0.19);
  for (let i = -1; i <= 1; i += 2) cyl(scene, 0.035, 0.035, 0.015, '#ffffff', mx + i * 0.12, TOP + 0.32, -0.18, 10, { rx: Math.PI / 2 });
  box(scene, 0.06, 0.04, 0.03, T.accent, mx + 0.22, TOP + 0.31, -0.17); // 추출 버튼
  cyl(scene, 0.05, 0.05, 0.05, T.metal, mx, TOP + 0.2, -0.2, 10);
  // 포터필터 (결합 상태)
  cyl(scene, 0.055, 0.045, 0.04, T.metal, mx, TOP + 0.16, -0.2, 10);
  box(scene, 0.03, 0.03, 0.18, T.machine2, mx, TOP + 0.165, -0.06);
  box(scene, 0.4, 0.02, 0.2, T.metal, mx, TOP, -0.27); // 드립 트레이
  // 스팀 완드
  box(scene, 0.015, 0.2, 0.015, T.metal, mx - 0.25, TOP + 0.05, -0.17);

  // 정수기
  const wx = 0.47;
  box(scene, 0.3, 0.5, 0.38, '#ffffff', wx, TOP, -0.45);
  box(scene, 0.2, 0.18, 0.06, '#5b6a78', wx, TOP + 0.03, -0.25);
  box(scene, 0.04, 0.04, 0.04, T.accent, wx, TOP + 0.21, -0.24);
  cyl(scene, 0.1, 0.1, 0.22, '#8fd3f4', wx, TOP + 0.5, -0.45, 10);

  // 제빙기
  const ix = 0.86;
  box(scene, 0.46, 0.55, 0.45, T.metal, ix, TOP, -0.42);
  box(scene, 0.28, 0.2, 0.06, '#5b6a78', ix, TOP + 0.03, -0.19);
  box(scene, 0.06, 0.04, 0.04, '#9fe8ff', ix, TOP + 0.24, -0.17);
  box(scene, 0.3, 0.06, 0.01, '#ffffff', ix, TOP + 0.4, -0.19);

  // 싱크대 (가장 오른쪽)
  const sx = 1.6;
  box(scene, 0.7, 0.06, 0.55, T.metal, sx, TOP - 0.04, -0.33);
  box(scene, 0.56, 0.02, 0.42, '#5b6a78', sx, TOP + 0.005, -0.33, { noLine: true });
  cyl(scene, 0.02, 0.02, 0.32, T.metal, sx, TOP, -0.58, 6);
  box(scene, 0.03, 0.03, 0.18, T.metal, sx, TOP + 0.3, -0.5);

  // 앞쪽 소품: 컵 더미, 뚜껑, 컵 홀더, 붓, 탬퍼
  for (let i = 0; i < 4; i++) cyl(scene, 0.045, 0.035, 0.13, '#eaf6fb', 0.25, TOP + i * 0.025, -0.05, 10);
  for (let i = 0; i < 5; i++) cyl(scene, 0.05, 0.05, 0.012, '#ffffff', 0.42, TOP + i * 0.012, -0.03, 10);
  for (let i = 0; i < 5; i++) cyl(scene, 0.048, 0.043, 0.012, '#b07a4a', 0.58, TOP + i * 0.012, -0.03, 10);
  box(scene, 0.03, 0.015, 0.12, '#c27a3e', -0.3, TOP, -0.05);
  box(scene, 0.04, 0.025, 0.03, '#333333', -0.3, TOP, -0.12);
  cyl(scene, 0.045, 0.045, 0.02, T.metal, -0.17, TOP, -0.06, 10);
  cyl(scene, 0.015, 0.02, 0.07, T.machine2, -0.17, TOP + 0.02, -0.06, 6);
  // 컵 (정수기 아래)
  const cupG = new THREE.CylinderGeometry(0.045, 0.035, 0.13, 12);
  const cup = new THREE.Mesh(cupG, new THREE.MeshStandardMaterial({ color: '#eaf6fb', transparent: true, opacity: 0.55, flatShading: true }));
  cup.position.set(wx, TOP + 0.065, -0.24); scene.add(cup);
  cyl(scene, 0.04, 0.034, 0.08, '#3b2010', wx, TOP + 0.003, -0.24, 12, { noLine: true });

  // 손 (마우스 따라감)
  hand = new THREE.Group();
  const skin = T.skin;
  box(hand, 0.09, 0.03, 0.1, skin, 0, 0, 0);
  for (let i = 0; i < 4; i++) box(hand, 0.018, 0.022, 0.07, skin, -0.033 + i * 0.022, 0.003, -0.08, { rx: -0.25 });
  box(hand, 0.02, 0.022, 0.05, skin, -0.06, 0.0, -0.01, { rx: 0, rz: 0.6 });
  box(hand, 0.07, 0.07, 0.25, T.sleeve, 0.01, -0.03, 0.17);
  hand.scale.setScalar(0.8);
  hand.rotation.y = 0.25;
  scene.add(hand);
  // 왼손 (정지)
  const left = new THREE.Group();
  box(left, 0.09, 0.03, 0.1, skin, 0, 0, 0);
  for (let i = 0; i < 4; i++) box(left, 0.018, 0.022, 0.07, skin, -0.033 + i * 0.022, 0.003, -0.08, { rx: -0.25 });
  box(left, 0.07, 0.07, 0.25, T.sleeve, -0.01, -0.03, 0.17);
  left.scale.setScalar(0.8);
  left.position.set(-0.25, TOP + 0.06, 0.25); left.rotation.y = -0.35;
  scene.add(left);
}

// 마우스 → 카운터 위 평면에 손 배치
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(0.3, -0.3);
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(TOP + 0.12));
const tgt = new THREE.Vector3();
addEventListener('mousemove', e => { ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); });

function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

document.querySelectorAll('#ui button').forEach(b => b.onclick = () => build(b.dataset.t));
build(THEMES[location.hash.slice(1)] ? location.hash.slice(1) : 'A');

const t0 = performance.now();
renderer.setAnimationLoop(now => {
  ray.setFromCamera(ndc, camera);
  if (ray.ray.intersectPlane(plane, tgt)) {
    tgt.z = Math.max(-0.35, Math.min(0.35, tgt.z)); tgt.x = Math.max(-0.9, Math.min(1.9, tgt.x));
    hand.position.lerp(new THREE.Vector3(tgt.x, tgt.y + Math.sin(now / 300) * 0.005, tgt.z + 0.05), 0.25);
  }
  document.getElementById('timer').textContent = ((now - t0) / 1000 % 100).toFixed(2).padStart(5, '0');
  renderer.render(scene, camera);
});
</script>
</body>
</html>
